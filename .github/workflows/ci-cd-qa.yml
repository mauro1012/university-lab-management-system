name: Deploy QA

on:
  push:
    branches: [QA]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Elimina cualquier rastro de configuraciones locales o de otros entornos
      - name: Clean Terraform artifacts
        run: |
          find . -name ".terraform" -type d -exec rm -rf {} +
          find . -name "*.tfstate*" -type f -not -path "./terraform/boostrap/*" -exec rm -f {} +
          find . -name ".terraform.lock.hcl" -type f -exec rm -f {} +

      # 1. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build & Push Docker images
      - name: Build & Push Docker images
        run: |
          docker build -t mauro28102023/auth-service:qa ./services/security-domain/auth-service
          docker push mauro28102023/auth-service:qa
          
          docker build -t mauro28102023/resource-service:qa ./services/inventory-domain/resource-service
          docker push mauro28102023/resource-service:qa

      # 3. AWS credentials (Nuevas llaves de AWS Academy)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 4. Terraform Setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # --- PASO DE BOOSTSTRAP (Crea el Bucket S3 en el nuevo laboratorio) ---
      - name: Terraform Bootstrap
        working-directory: terraform/boostrap
        run: |
          terraform init -reconfigure
          terraform apply -auto-approve

      # 5. Terraform Init & Apply QA (Conecta al nuevo S3)
      - name: Terraform Init (QA)
        working-directory: terraform/qa
        run: terraform init -reconfigure 

      - name: Terraform Apply (QA)
        id: apply
        working-directory: terraform/qa
        run: terraform apply -auto-approve
        env:
          TF_VAR_environment: "qa"
          TF_VAR_vpc_cidr: "10.0.0.0/16"
          TF_VAR_instance_type: "t3.micro"
          TF_VAR_key_name: "fisrkeys"
          TF_VAR_bastion_key_name: "fisrkeys"
          TF_VAR_bastion_ami_id: "ami-0c02fb55956c7d316"
          TF_VAR_docker_image_auth: "mauro28102023/auth-service:qa"
          TF_VAR_docker_image_resource: "mauro28102023/resource-service:qa"
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      # 6. Configurar llave SSH para Túneles
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n\tExitOnForwardFailure yes" > ~/.ssh/config

      # 7-8. Migraciones Prisma (Auth y Resource) con validación de puerto
      - name: Run Auth Prisma Migrations
        working-directory: services/security-domain/auth-service
        run: |
          npm install prisma @prisma/client
          RAW_ENDPOINT=$(terraform -chdir=../../../terraform/qa output -raw rds_endpoint)
          RDS_ENDPOINT=$(echo $RAW_ENDPOINT | cut -d':' -f1)
          BASTION_IP=$(terraform -chdir=../../../terraform/qa output -raw bastion_public_ip)
          
          ssh -f -L 5433:$RDS_ENDPOINT:5432 ec2-user@$BASTION_IP -N
          timeout 30s bash -c 'until printf "" 2>>/dev/null >/dev/tcp/localhost/5433; do sleep 2; done'
          
          export DATABASE_URL="postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5433/${{ secrets.DB_NAME }}"
          npx prisma migrate deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Run Resource Prisma Migrations
        working-directory: services/inventory-domain/resource-service
        run: |
          npm install prisma @prisma/client
          RAW_ENDPOINT=$(terraform -chdir=../../../terraform/qa output -raw rds_endpoint)
          RDS_ENDPOINT=$(echo $RAW_ENDPOINT | cut -d':' -f1)
          BASTION_IP=$(terraform -chdir=../../../terraform/qa output -raw bastion_public_ip)
          
          ssh -f -L 5434:$RDS_ENDPOINT:5432 ec2-user@$BASTION_IP -N
          timeout 30s bash -c 'until printf "" 2>>/dev/null >/dev/tcp/localhost/5434; do sleep 2; done'
          
          export DATABASE_URL="postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5434/${{ secrets.DB_NAME }}"
          npx prisma migrate deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      # 9. ALB DNS Final
      - name: Get ALB DNS
        working-directory: terraform/qa
        run: terraform output alb_dns_name