name: Deploy QA

on:
  push:
    branches: [QA]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build & Push Docker images
      - name: Build & Push Docker images
        run: |
          docker build -t mauro28102023/auth-service:qa ./services/security-domain/auth-service
          docker push mauro28102023/auth-service:qa
          
          docker build -t mauro28102023/resource-service:qa ./services/inventory-domain/resource-service
          docker push mauro28102023/resource-service:qa

      # 3. AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 4. Terraform Setup & Apply
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform/qa
        run: terraform init

      - name: Terraform Apply (QA)
        id: apply
        working-directory: terraform/qa
        run: terraform apply -auto-approve

      # 5. Configurar llave SSH para Túneles
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n\tExitOnForwardFailure yes" > ~/.ssh/config

      # 6. Migraciones para Auth Service
      - name: Run Auth Prisma Migrations
        working-directory: services/security-domain/auth-service
        run: |
          npm install prisma @prisma/client
          
          RAW_ENDPOINT=$(terraform -chdir=../../../terraform/qa output -raw rds_endpoint)
          RDS_ENDPOINT=$(echo $RAW_ENDPOINT | cut -d':' -f1)
          BASTION_IP=$(terraform -chdir=../../../terraform/qa output -raw bastion_public_ip)
          
          echo "Abriendo túnel Auth en puerto 5433..."
          ssh -f -L 5433:$RDS_ENDPOINT:5432 ec2-user@$BASTION_IP -N
          
          # Validación activa del puerto
          echo "Esperando conexión a base de datos..."
          timeout 30s bash -c 'until printf "" 2>>/dev/null >/dev/tcp/localhost/5433; do sleep 2; echo "Reintentando..."; done' || (echo "Error: No se pudo conectar a la DB" && exit 1)
          
          export DATABASE_URL="postgresql://dbadmin:SecurePassword123!@localhost:5433/university_db"
          npx prisma migrate deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      # 7. Migraciones para Resource Service
      - name: Run Resource Prisma Migrations
        working-directory: services/inventory-domain/resource-service
        run: |
          npm install prisma @prisma/client
          
          RAW_ENDPOINT=$(terraform -chdir=../../../terraform/qa output -raw rds_endpoint)
          RDS_ENDPOINT=$(echo $RAW_ENDPOINT | cut -d':' -f1)
          BASTION_IP=$(terraform -chdir=../../../terraform/qa output -raw bastion_public_ip)
          
          echo "Abriendo túnel Resource en puerto 5434..."
          ssh -f -L 5434:$RDS_ENDPOINT:5432 ec2-user@$BASTION_IP -N
          
          echo "Esperando conexión a base de datos..."
          timeout 30s bash -c 'until printf "" 2>>/dev/null >/dev/tcp/localhost/5434; do sleep 2; echo "Reintentando..."; done' || (echo "Error: No se pudo conectar a la DB" && exit 1)
          
          export DATABASE_URL="postgresql://dbadmin:SecurePassword123!@localhost:5434/university_db"
          npx prisma migrate deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      # 8. Mostrar URL del balanceador
      - name: Get ALB DNS
        working-directory: terraform/qa
        run: terraform output alb_dns_name