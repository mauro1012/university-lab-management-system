name: Deploy QA

on:
  push:
    branches: [QA]
      

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #  Login a ECR Public
      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws

      #  Build & Push Docker image a ECR Public
      - name: Build & Push Docker image
        run: |
          docker build -t mauro28102023/base-service:qa ./services/base-service
          docker push mauro28102023/base-service:qa


      #  AWS credentials (solo para Terraform)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      #  Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: |
          cd terraform/qa
          terraform init

      - name: Terraform Apply (QA)
        run: |
          cd terraform/qa
          terraform apply -auto-approve
